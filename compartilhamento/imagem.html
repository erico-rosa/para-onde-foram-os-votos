<!doctype html>
<!-- Fonte da imagem de compartilhamento (og-image.png, 1200×630). Para regenerar, veja o README. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f6f4; color: #1d1f22; font-family: "Segoe UI", system-ui, Roboto, Arial, sans-serif; display: grid; grid-template-rows: auto 1fr auto; padding: 64px 72px 56px; position: relative; }
  body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: #2f5d8a; }
  .eyebrow { font-size: 26px; letter-spacing: .08em; text-transform: uppercase; color: #2f5d8a; font-weight: 600; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 92px; line-height: 1.02; margin: 18px 0 0; letter-spacing: -.01em; }
  .sub { font-size: 32px; color: #5f646b; margin-top: 22px; max-width: 900px; line-height: 1.3; }
  .nums { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 64px; border-top: 2px solid #e2e2de; padding-top: 28px; }
  .nums div { display: grid; gap: 4px; }
  .nums b { font-family: Georgia, serif; font-weight: 400; font-size: 52px; font-variant-numeric: tabular-nums; }
  .nums span { font-size: 22px; color: #5f646b; }
  .nums .up { color: #1f7a4a; font-size: 34px; margin-left: 6px; }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Presidente 2026 · 1º e 2º turno</div>
    <h1>Para onde foram<br>os votos</h1>
    <div class="sub">Do Brasil inteiro até cada seção eleitoral, com o que mudou de um turno para o outro.</div>
  </div>
  <div></div>
  <div class="nums">
    <div><b>5.571</b><span>municípios e o exterior</span></div>
    <div><b>499.206</b><span>seções eleitorais</span></div>
    <div><b>+2,96 mi<span class="up">▲</span></b><span>eleitores a mais no 2º turno</span></div>
  </div>
</body>
</html>
